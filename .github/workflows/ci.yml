name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchtower_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/watchtower_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo (end-to-end core flow)
        run: npm run demo
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/watchtower_test

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchtower
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: watchtower:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (migrations, health, metrics, homepage)
        run: |
          docker run -d --name wt --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/watchtower watchtower:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/health
          curl -fsS localhost:3000/metrics | grep -q watchtower_active_watches
          curl -fsS localhost:3000/ | grep -q "Job-board monitoring for AI agents"
          test "$(docker exec wt whoami)" = node
      - name: Container logs
        if: always()
        run: docker logs wt || true
